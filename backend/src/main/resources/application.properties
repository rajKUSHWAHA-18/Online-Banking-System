spring.application.name=online-banking-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${BANK_DB_URL:jdbc:mysql://localhost:3306/online_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${BANK_DB_USERNAME:banking}
spring.datasource.password=${BANK_DB_PASSWORD:banking_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}